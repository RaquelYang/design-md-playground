<section class="hero" aria-labelledby="hero-heading">
    <!-- Workflow Badge Row -->
    <div class="hero__workflow" aria-label="開發流程">
        <span class="hero__workflow-badge hero__workflow-badge--develop">Develop</span>
        <mat-icon class="hero__workflow-arrow" aria-hidden="true">arrow_forward</mat-icon>
        <span class="hero__workflow-badge hero__workflow-badge--preview">Preview</span>
        <mat-icon class="hero__workflow-arrow" aria-hidden="true">arrow_forward</mat-icon>
        <span class="hero__workflow-badge hero__workflow-badge--ship">Ship</span>
    </div>

    <!-- Headline -->
    <h1 id="hero-heading" class="hero__headline">Hi, I'm Alex.<br />I build things for the web.</h1>

    <!-- Sub-headline -->
    <p class="hero__sub">
        Frontend Developer specializing in Angular &amp; TypeScript.<br />
        Crafting digital experiences with a focus on precision, performance, and accessibility.
    </p>

    <!-- CTA Buttons -->
    <div class="hero__cta">
        <button mat-flat-button class="hero__btn-primary" aria-label="查看我的作品">View My Work</button>
        <button mat-stroked-button class="hero__btn-ghost" aria-label="聯絡我">Contact Me</button>
    </div>

    <!-- Scroll Indicator -->
    <div class="hero__scroll" aria-hidden="true">
        <mat-icon class="hero__scroll-icon">keyboard_arrow_down</mat-icon>
    </div>
</section>
